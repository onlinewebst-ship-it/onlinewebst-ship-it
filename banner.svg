<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Woody — Online Web Studio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111a24"/>
      <stop offset="100%" stop-color="#0d1b1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f81f7"/>
      <stop offset="100%" stop-color="#2ecc8f"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="230" fill="url(#bg)"/>
  <rect width="1200" height="230" fill="url(#grid)"/>
  <rect x="0" y="0" width="6" height="230" fill="url(#accent)"/>

  <text x="64" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#f0f6fc">Woody</text>
  <text x="64" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#2ecc8f">Online Web Studio · Grimsby, UK</text>

  <text x="64" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#8b949e">AI agents, automations and SEO tooling for web work that has to pay for itself.</text>

  <g transform="translate(1010,70)">
    <circle cx="0" cy="0" r="46" fill="none" stroke="url(#accent)" stroke-width="3" stroke-opacity="0.7"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#2ecc8f" stroke-width="2" stroke-opacity="0.45"/>
    <circle cx="0" cy="0" r="9" fill="#2f81f7"/>
  </g>
</svg>
